name: v1.1 Public Source Release

on:
  push:
    branches: [main]
    paths:
      - '.github/release-requests/v1.1.0.json'
      - 'governance/public-source-release-candidate.v1.1.0.json'
      - 'scripts/verify-release-candidate.js'
      - '.github/workflows/v1.1-source-release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve governed release request
        id: request
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = require('./package.json');
          const req = JSON.parse(fs.readFileSync('.github/release-requests/v1.1.0.json', 'utf8'));
          const license = 'LicenseRef-BossAI-Community-Source-1.0';
          if (req.schemaVersion !== 'bossai.community-demo-release-request.v1') throw new Error('Unexpected release schema.');
          if (pkg.version !== '1.1.0' || req.version !== pkg.version || req.tag !== `v${pkg.version}`) throw new Error('v1.1.0 version/tag mismatch.');
          if (pkg.license !== license || req.license !== license) throw new Error('License identity changed.');
          if (req.sourceOnly !== true || req.productionPlatformApiValidated !== false || req.signedBinaryIncluded !== false) throw new Error('Release truth boundary violated.');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=${req.tag}\n`);
          NODE
      - name: Inspect immutable release state
        id: immutable_state
        env:
          TAG: ${{ steps.request.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            existing_sha="$(git rev-list -n 1 "$TAG")"
            echo "Tag $TAG already exists at $existing_sha; preserving it without movement."
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "sha=$existing_sha" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $TAG does not exist yet; release-candidate attestation is required."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify current API-free source boundaries
        run: |
          npm run demo
          npm run check
      - name: Verify unreleased v1.1 release candidate
        if: steps.immutable_state.outputs.exists == 'false'
        run: npm run verify:release-candidate
      - name: Verify existing immutable GitHub Release
        if: steps.immutable_state.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.request.outputs.tag }}
        shell: bash
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          echo "Existing $TAG release verified; no tag or release mutation will occur."
      - name: Create immutable source tag
        if: steps.immutable_state.outputs.exists == 'false'
        env:
          TAG: ${{ steps.request.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
      - name: Create GitHub Release
        if: steps.immutable_state.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.request.outputs.tag }}
        shell: bash
        run: |
          cat > /tmp/release-notes.md <<'NOTES'
          # douyin-taobao-cs v1.1.0 — API-free Connector Reference

          Hardened public-source release for Douyin/Taobao/Tmall/Qianniu customer-service connector patterns.

          ## Validated locally and in CI
          - API-free synthetic signed-webhook demo;
          - 20 connector/signature/policy/idempotency/data-minimization tests;
          - 17 local HTTP E2E scenarios;
          - canonical BossAI Customer Service intake contract;
          - review-only BossAI OS drafting boundary;
          - direct sends/refunds/order mutations fail closed.

          ## Not claimed
          - no real Douyin/Taobao merchant production API access is included or validated;
          - no merchant secret, platform token or customer PII is included;
          - no hosted SaaS or signed production binary is included.

          Existing v1.0.0 remains immutable release history.
          Commercial entry: https://bossaios.com
          NOTES
          gh release create "$TAG" --title "douyin-taobao-cs v1.1.0 — API-free Connector Reference" --notes-file /tmp/release-notes.md --verify-tag
