name: Community Demo feedback / Community Demo 反馈
description: Share your API-free demo result or integration need in about one minute. Never post platform credentials or customer data. / 用约 1 分钟反馈 API-free Demo 或集成需求，请勿提交平台凭据或客户数据。
title: "[Demo] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying the BossAI Douyin/Taobao customer-service connector reference.

        **This form is intentionally short.** A real production-platform validation is a separate step; you do not need Douyin/Taobao credentials to submit feedback.

        Never post App Keys, App Secrets, access tokens, session keys, cookies, customer conversations, order/customer data, phone numbers, addresses, private logs, or other sensitive/private information.

        感谢试用 BossAI 抖音 / 淘宝客服 Connector Reference。**这个反馈表刻意保持简短。** 无需抖音/淘宝凭据即可提交；真实生产平台验收属于后续独立步骤。

        请勿提交 App Key、App Secret、Access Token、Session Key、Cookie、客户对话、订单/客户数据、手机号、地址、私有日志或其他敏感/隐私信息。

  - type: dropdown
    id: local_demo
    attributes:
      label: API-free demo result / API-free Demo 结果
      options:
        - Demo passed / Demo 已通过
        - Demo ran but something failed / Demo 可运行但有步骤失败
        - Installation or startup failed / 安装或启动失败
        - I have not run it yet; I have an integration question / 尚未运行，我有集成问题
    validations:
      required: true

  - type: checkboxes
    id: interests
    attributes:
      label: What matters to you? / 你最关注什么？
      options:
        - label: Douyin ecommerce customer service / 抖音电商客服
        - label: Taobao / Tmall / Qianniu customer service / 淘宝 / 天猫 / 千牛客服
        - label: Signed webhook compatibility / Webhook 签名兼容
        - label: Human review / safe AI drafts / 人工审核与安全 AI 草稿
        - label: BossAI Customer Service integration / BossAI 统一客服接入
        - label: Ecommerce operations beyond customer service / 客服之外的电商运营

  - type: textarea
    id: need
    attributes:
      label: What do you want to solve, or what blocked you? / 你想解决什么，或者哪里卡住了？
      description: A short sentence is enough. Include only public-safe error text or requirements. / 一两句话即可，只填写可公开的错误信息或需求。
      placeholder: "Example: npm run demo passed; I want to understand how to connect a real Qianniu webhook later. / 例如：Demo 已通过，后续想了解如何接入真实千牛 webhook。"
    validations:
      required: true

  - type: dropdown
    id: intended_use
    attributes:
      label: Intended use / 预期用途
      options:
        - Personal learning/evaluation / 个人学习或评估
        - Internal business evaluation / 企业内部评估
        - Ecommerce operations / 电商运营
        - Customer-service outsourcing or client delivery / 客服外包或客户交付
        - SaaS / hosted service evaluation / SaaS 或托管服务评估
        - Not sure yet / 暂不确定
    validations:
      required: true

  - type: dropdown
    id: platform_access
    attributes:
      label: Optional: current legitimate platform API access / 可选：当前是否已有合法平台 API 权限
      description: Do not paste credentials. / 请勿粘贴任何凭据。
      options:
        - Douyin access / 已有抖音权限
        - Taobao / Tmall / Qianniu access / 已有淘宝 / 天猫 / 千牛权限
        - Both / 两者都有
        - Applying / 申请中
        - No / 暂无
        - Not sure / 不确定

  - type: checkboxes
    id: safety
    attributes:
      label: Safety acknowledgement / 安全确认
      options:
        - label: I removed merchant secrets, tokens, cookies, customer conversations, order/customer data, private logs and other sensitive/private information. / 我已移除商家 Secret、Token、Cookie、客户对话、订单/客户数据、私有日志及其他敏感/隐私信息。
          required: true
        - label: I understand this repository does not claim validated Douyin/Taobao/Tmall/Qianniu production API access. / 我知道本仓库不声称已完成抖音/淘宝/天猫/千牛生产 API 验收。
          required: true
